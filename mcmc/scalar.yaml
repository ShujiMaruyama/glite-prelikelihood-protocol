packages_path: packages
output: chains/scalar

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE_lite_native: null
  bao.desi_dr2: null
  sn.pantheonplus: null

theory:
  rims_classy.RIMSClassy:
    python_path: .
    path: ./class_public
    ignore_obsolete: false
    stop_at_error: false
    extra_args:
      gauge: synchronous
      ic: ad
      idm_soundspeed: no
      N_ur: 3.044
      N_ncdm: 0
      YHe: BBN
      scf_parameters: "5., 0., 0., 0., 4.44, 0."
      attractor_ic_scf: no
      scf_tuning_index: 0
      rims_enabled: yes
      rims_alpha_U: 0.0
      rims_phi_transition: 100.0
      rims_enforce_stability: yes
      rims_stability_tolerance: 1.e-10
      rims_require_normalization: yes
      rims_normalization_tolerance: 1.e-8
      rims_subleading_adiabatic_ic: yes
      recombination: HYREC
      reio_parametrization: reio_camb
      k_pivot: 0.05
      non_linear: none

params:
  H0:
    prior: {min: 55.0, max: 82.0}
    ref: {dist: norm, loc: 67.8, scale: 1.0}
    proposal: 0.35
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.026}
    ref: {dist: norm, loc: 0.0224, scale: 0.00025}
    proposal: 0.00012
    latex: \Omega_b h^2
  omega_dm:
    prior: {min: 0.090, max: 0.155}
    ref: {dist: norm, loc: 0.119, scale: 0.004}
    proposal: 0.0012
    drop: true
    latex: \omega_{dm}
  omega_cdm:
    value: "lambda omega_dm: 0.1*omega_dm"
    latex: \omega_c
  omega_idm:
    value: "lambda omega_dm: 0.9*omega_dm"
    latex: \omega_{idm}
  logA:
    prior: {min: 2.75, max: 3.35}
    ref: {dist: norm, loc: 3.045, scale: 0.025}
    proposal: 0.008
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.90, max: 1.05}
    ref: {dist: norm, loc: 0.966, scale: 0.008}
    proposal: 0.003
    latex: n_s
  tau_reio:
    prior: {min: 0.020, max: 0.120}
    ref: {dist: norm, loc: 0.055, scale: 0.010}
    proposal: 0.005
    latex: \tau
  Omega_scf:
    prior: {min: 0.001, max: 0.180}
    ref: {dist: norm, loc: 0.105, scale: 0.025}
    proposal: 0.012
    latex: \Omega_{\phi,0}
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5"
    latex: S_8

sampler:
  mcmc:
    max_samples: 8000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.15
    Rminus1_cl_level: 0.95
    learn_proposal: true
    learn_every: 40d
    proposal_scale: 2.4
    oversample_power: 0.4
    oversample_thin: true
    measure_speeds: true
    output_every: 60s
    max_tries: 1000d

debug: false
