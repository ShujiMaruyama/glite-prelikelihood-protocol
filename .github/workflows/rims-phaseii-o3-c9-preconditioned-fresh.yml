name: RIMS Phase II O3 c9 preconditioned fresh production candidate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: rims-phaseii-o3-c9-preconditioned-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run-gate:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.gate.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "execute=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head_sha="${{ github.event.pull_request.head.sha }}"; git fetch --no-tags --depth=1 origin "$head_sha" || true
          msg="$(git show -s --format=%B "$head_sha")"; printf 'head=%s\n%s\n' "$head_sha" "$msg"
          if grep -Fq '[RIMS-C9-RUN]' <<<"$msg"; then echo "execute=true" >> "$GITHUB_OUTPUT"; else echo "execute=false" >> "$GITHUB_OUTPUT"; fi

  config-audit:
    needs: run-gate
    if: needs.run-gate.outputs.execute == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit frozen c9 decision and generator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pyyaml
          python -m py_compile mcmc_o3/build_c9_preconditioner.py mcmc_o3/c8_transport_map.py mcmc_o3/scalar_c8_transport_map.py
          (cd mcmc_o3 && python test_c8_transport_map.py)
          (cd mcmc_o3 && python test_scalar_c8_transport_map.py)
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('mcmc_o3/C8P1_TO_C9_DECISION_20260907.json').read_text())
          assert d['decision']=='PROMOTE_FRESH_C9_PRECONDITIONED_TRANSPORT'
          assert d['gate_result']=='FAIL_BLIND_C8_RESUME'
          assert d['c9_intervention']['posterior_samples_reused'] is False
          assert d['c9_intervention']['sentinel_samples_are_discarded'] is True
          print('c9 decision PASS')
          PY

  mcmc:
    needs: [run-gate, config-audit]
    if: needs.run-gate.outputs.execute == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {model: scalar, c8_yaml: scalar_exp_c8_transport.yaml, chain_root: scalar_c9}
          - {model: rims, c8_yaml: rims_exp_shell_c8_transport.yaml, chain_root: rims_c9}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
      MODEL: ${{ matrix.model }}
      CHAIN_ROOT: ${{ matrix.chain_root }}
      C7_RUN_ID: "34074123144"
      SENTINEL_MINUTES: "15"
      SEGMENT_MINUTES: "90"
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct pinned RIMS V18.29 CLASS source
        run: |
          set -euo pipefail
          cat rims_o3_patch/base_parts/part00 rims_o3_patch/base_parts/part01 rims_o3_patch/base_parts/part02_03 rims_o3_patch/base_parts/part04_05 rims_o3_patch/base_parts/part06 > rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          cat rims_o3_patch/delta_parts/part00_01 rims_o3_patch/delta_parts/part02_03 rims_o3_patch/delta_parts/part04 > rims_o3_patch/V18_23_TO_V18_29.patch
          test "$(sha256sum rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff | awk '{print $1}')" = "6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74"
          test "$(sha256sum rims_o3_patch/V18_23_TO_V18_29.patch | awk '{print $1}')" = "c322fb05b7414be9f88cf90ff0580694e7677c8da91d78a5480ea9cf10f2b8dc"
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public && git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff && git apply ../rims_o3_patch/V18_23_TO_V18_29.patch && git diff --check
          git rev-parse HEAD > ../CLASS_UPSTREAM_COMMIT.txt && git diff > ../RIMS_V18_29_RECONSTRUCTED.diff

      - name: Install CLASS and inference stack
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' numpy scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build) && python -m pip install -e ./class_public

      - name: Cache matched likelihood packages
        uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-o3-v2

      - name: Install or verify matched likelihood data
        run: |
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages

      - name: Recover and verify c7 diagnostic geometry source
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          rm -rf _c7 c9_runtime && mkdir _c7 c9_runtime
          gh run download "$C7_RUN_ID" -n "rims-phaseii-o3-${MODEL}-c7" -D _c7
          test -s _c7/SHA256SUMS.txt && (cd _c7 && sha256sum -c SHA256SUMS.txt)
          python mcmc_o3/build_c9_preconditioner.py --model "$MODEL" --c7-dir _c7 --repo-mcmc-dir mcmc_o3 --out-dir c9_runtime
          if [ "$MODEL" = scalar ]; then YAML="c9_runtime/scalar_exp_c9_preconditioned.yaml"; else YAML="c9_runtime/rims_exp_shell_c9_preconditioned.yaml"; fi
          echo "YAML=$YAML" >> "$GITHUB_ENV"
          python - <<'PY'
          import os,yaml,pathlib
          model=os.environ['MODEL']; c8='mcmc_o3/scalar_exp_c8_transport.yaml' if model=='scalar' else 'mcmc_o3/rims_exp_shell_c8_transport.yaml'
          c9=os.environ['YAML']
          a=yaml.safe_load(pathlib.Path(c8).read_text()); b=yaml.safe_load(pathlib.Path(c9).read_text())
          def target(d):
              return {'likelihood':d['likelihood'],'theory':d['theory'],'params':{k:{x:v[x] for x in ['prior','value','min','max','derived'] if isinstance(v,dict) and x in v} if isinstance(v,dict) else v for k,v in d['params'].items()}}
          assert target(a)==target(b); assert a['params']['H0']['value']==b['params']['H0']['value']
          print('c8->c9 target equivalence PASS')
          PY

      - name: c9 theory plus likelihood preflight
        run: |
          rm -rf chains_c9 sentinel_c9
          cobaya-run "$YAML" --test
          rm -rf chains_c9 sentinel_c9

      - name: Run disposable c9 proposal-geometry sentinel
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,yaml
          from pathlib import Path
          d=yaml.safe_load(Path(os.environ['YAML']).read_text()); d['output']=f"sentinel_c9/{os.environ['CHAIN_ROOT']}_sentinel"
          Path('sentinel_c9_input.yaml').write_text(yaml.safe_dump(d,sort_keys=False))
          PY
          set +e
          timeout --signal=INT --kill-after=45s "${SENTINEL_MINUTES}m" mpirun --oversubscribe -np 4 cobaya-run sentinel_c9_input.yaml > "sentinel_${MODEL}.log" 2>&1; rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then cat "sentinel_${MODEL}.log"; exit "$rc"; fi
          python - <<'PY'
          import json,os; from pathlib import Path; import numpy as np
          root=f"{os.environ['CHAIN_ROOT']}_sentinel"; rows=0; weights=0.; chains={}
          for i in range(1,5):
              p=Path('sentinel_c9')/f'{root}.{i}.txt'; assert p.exists() and p.stat().st_size>0,p
              a=np.loadtxt(p); a=a[None,:] if a.ndim==1 else a; r=len(a); w=float(a[:,0].sum()); rows+=r; weights+=w; chains[str(i)]={'rows':int(r),'weight_sum':w,'acceptance':float(r/w)}
          acc=float(rows/weights); out={'model':os.environ['MODEL'],'rows':int(rows),'weight_sum':weights,'acceptance':acc,'chains':chains,'gate':[0.15,0.60]}
          Path(f'C9_SENTINEL_{os.environ["MODEL"]}.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          assert rows>=40; assert 0.15 <= acc <= 0.60,acc
          PY
          rm -rf sentinel_c9

      - name: Freeze c9 execution contract
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess; from pathlib import Path
          files=[os.environ['YAML'],'mcmc_o3/build_c9_preconditioner.py','mcmc_o3/C8P1_TO_C9_DECISION_20260907.json','mcmc_o3/C8_C9_PRECONDITIONING_PROTOCOL.md']
          cov='c9_runtime/'+os.environ['MODEL']+'_c9_precond.covmat'; files.append(cov)
          d={'schema':'rims-phaseii-o3-c9-execution-contract-v1','model':os.environ['MODEL'],'fresh_chain':True,'uses_c7_or_c8_posterior_samples':False,'target_distribution_changed':False,'coordinate_map_changed_from_c8':False,'proposal_scale':2.4,'learn_proposal':False,'sentinel_discarded':True,'segment_minutes':90,'production_gate':{'GetDist_Rminus1_lt':0.01,'minimum_headline_ESS_ge':1000.0},'git_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}}
          Path(f'C9_EXECUTION_CONTRACT_{os.environ["MODEL"]}.json').write_text(json.dumps(d,indent=2)); print(json.dumps(d,indent=2))
          PY

      - name: Run fresh four-chain c9 production segment
        continue-on-error: true
        run: |
          set -o pipefail; set +e; rm -rf chains_c9
          timeout --signal=INT --kill-after=60s "${SEGMENT_MINUTES}m" mpirun --oversubscribe -np 4 cobaya-run "$YAML" 2>&1 | tee "o3_${MODEL}_c9p1.log"
          rc=${PIPESTATUS[0]}; set -e; echo "$rc" > "o3_${MODEL}_c9p1_exit_code.txt"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then echo "$rc" > "SAMPLER_FATAL_${MODEL}.flag"; fi
          exit 0

      - name: Analyze and package c9 checkpoint
        if: ${{ always() }}
        run: |
          set +e
          ROOT="chains_c9/${CHAIN_ROOT}"; n=$(find chains_c9 -maxdepth 1 -name "${CHAIN_ROOT}.[1-4].txt" 2>/dev/null | wc -l)
          if [ "$n" -ge 2 ]; then python mcmc_o3/analyze_o3_chains.py --model "$MODEL" --root "$ROOT" --out "analysis_${MODEL}_c9p1" || true; python mcmc_o3/audit_transport.py --model "$MODEL" --root "$ROOT" --out "transport_${MODEL}_c9p1.json" || true; fi
          rm -rf artifact && mkdir artifact
          cp CLASS_UPSTREAM_COMMIT.txt RIMS_V18_29_RECONSTRUCTED.diff artifact/ 2>/dev/null
          cp "$YAML" c9_runtime/${MODEL}_c9_precond.covmat c9_runtime/${MODEL}_c9_precond_meta.json artifact/
          cp mcmc_o3/build_c9_preconditioner.py mcmc_o3/C8P1_TO_C9_DECISION_20260907.json mcmc_o3/C8_C9_PRECONDITIONING_PROTOCOL.md artifact/
          cp "C9_SENTINEL_${MODEL}.json" "C9_EXECUTION_CONTRACT_${MODEL}.json" "o3_${MODEL}_c9p1_exit_code.txt" "o3_${MODEL}_c9p1.log" artifact/ 2>/dev/null
          cp -a "analysis_${MODEL}_c9p1" "transport_${MODEL}_c9p1.json" chains_c9 artifact/ 2>/dev/null
          (cd artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload c9 fresh checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rims-phaseii-o3-${{ matrix.model }}-c9p1
          path: artifact
          if-no-files-found: error
          retention-days: 30

      - name: Final c9 status
        if: ${{ always() }}
        run: |
          test ! -f "SAMPLER_FATAL_${MODEL}.flag"; test -s "C9_SENTINEL_${MODEL}.json"; test -s "C9_EXECUTION_CONTRACT_${MODEL}.json"; test -d chains_c9
          test "$(find chains_c9 -maxdepth 1 -name "${CHAIN_ROOT}.[1-4].txt" | wc -l)" -eq 4
