name: temporary RIMS full MCMC

on:
  pull_request:
    branches:
      - main

jobs:
  mcmc:
    strategy:
      fail-fast: false
      matrix:
        model: [lcdm, scalar, rims]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Recover pinned RIMS V7 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _patch_artifact
          gh run download 30425050547 -n rims-v10-turnover-results -D _patch_artifact
          cp _patch_artifact/rims_class_v3.3.4_v7.patch ./rims_class_v3.3.4_v7.patch

      - name: Checkout and patch CLASS v3.3.4
        run: |
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_class_v3.3.4_v7.patch
          git rev-parse HEAD > ../CLASS_UPSTREAM_COMMIT.txt
          sha256sum ../rims_class_v3.3.4_v7.patch > ../PATCH_SHA256.txt

      - name: Install CLASS and inference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' numpy scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2'
          python -m pip install -e ./class_public
          python - <<'PY'
          import cobaya, classy
          print('Cobaya', cobaya.__version__)
          print('CLASS', getattr(classy, '__version__', 'unknown'))
          PY

      - name: Cache cosmology likelihood packages
        uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-v1

      - name: Install likelihood data
        run: |
          cobaya-install \
            planck_2018_lowl.TT \
            planck_2018_lowl.EE \
            planck_2018_highl_plik.TTTEEE_lite_native \
            bao.desi_dr2 \
            sn.pantheonplus \
            -p packages

      - name: Validate model configuration
        run: |
          cobaya-run mcmc/${{ matrix.model }}.yaml --test

      - name: Run four-chain MCMC to declared convergence target
        run: |
          mkdir -p chains
          mpirun --oversubscribe -np 4 cobaya-run mcmc/${{ matrix.model }}.yaml 2>&1 | tee mcmc_${{ matrix.model }}.log

      - name: Analyze posterior and convergence
        if: success()
        run: |
          python mcmc/analyze_chains.py \
            --model ${{ matrix.model }} \
            --root chains/${{ matrix.model }} \
            --out analysis_${{ matrix.model }}

      - name: Package MCMC artifact
        if: always()
        run: |
          mkdir -p artifact
          cp CLASS_UPSTREAM_COMMIT.txt PATCH_SHA256.txt artifact/ || true
          cp mcmc/${{ matrix.model }}.yaml artifact/ || true
          cp rims_classy.py mcmc/analyze_chains.py artifact/ || true
          cp mcmc_${{ matrix.model }}.log artifact/ || true
          cp -r chains artifact/ || true
          cp -r analysis_${{ matrix.model }} artifact/ || true
          python - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          meta = {
              'python': sys.version,
              'platform': platform.platform(),
              'model': os.environ.get('MATRIX_MODEL'),
          }
          try:
              meta['pip_freeze'] = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True).splitlines()
          except Exception as e:
              meta['pip_freeze_error'] = repr(e)
          Path('artifact/ENVIRONMENT.json').write_text(json.dumps(meta, indent=2))
          PY
          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
        env:
          MATRIX_MODEL: ${{ matrix.model }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-full-mcmc-${{ matrix.model }}
          path: artifact
          retention-days: 7
