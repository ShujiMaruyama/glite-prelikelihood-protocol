name: RIMS Phase II O3 c13b 27-step drag scale sentinel

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Safety default is preflight-only; sentinel executes bounded nonproduction 27-step dragging diagnostics"
        required: true
        type: choice
        default: preflight-only
        options:
          - preflight-only
          - sentinel

permissions:
  contents: read
  actions: read

concurrency:
  group: rims-phaseii-o3-c13b-${{ github.ref }}-${{ inputs.run_mode }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  PYTHONUNBUFFERED: 1

jobs:
  preflight:
    if: github.ref_name == 'rims-c13b-27step-drag-sentinel-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit frozen c13b contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('mcmc_o3/C13B_27STEP_DRAG_PREDECLARED_20261009.json').read_text())
          assert d['source_failed_run']['run_id']==37887669578
          assert d['source_failed_run']['artifact_id']==11597154860
          assert d['source_failed_run']['eligible_for_inference'] is False
          assert d['correction']['required_fast_block_factor']==243
          assert d['correction']['target_dragging_steps']==27
          assert d['correction']['tested_proposal_scales']==[4.0,4.8,5.7]
          assert d['automatic_follow_on'] is False
          assert d['automatic_long_run'] is False
          assert d['sentinel_samples_eligible_for_inference'] is False
          assert d['production_gate']['GetDist_Rminus1_lt']==0.01
          assert d['production_gate']['minimum_headline_ESS_ge']==1000.0
          print('c13b frozen contract PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          name: rims-phaseii-o3-c13-full-drag-sentinel
          path: c13_source
          repository: ShujiMaruyama/glite-prelikelihood-protocol
          run-id: 37887669578
          github-token: ${{ github.token }}

      - name: Build corrected 27-step sentinel inputs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.3' pyyaml
          python mcmc_o3/build_c13b_27step_sentinel.py --c13-dir c13_source --out-dir c13b_preflight | tee c13b_preflight_build.log
          (cd c13b_preflight && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('c13b_preflight/C13B_27STEP_PREFLIGHT.json').read_text())
          assert d['source_eligible_for_inference'] is False
          assert d['target_distribution_changed'] is False
          assert d['coordinate_map_changed'] is False
          assert d['proposal_covariance_changed'] is False
          assert d['target_drag_steps']==27
          assert d['manual_blocking'][1][0]==243
          assert d['tested_scales']==[4.0,4.8,5.7]
          assert d['automatic_follow_on'] is False
          assert d['automatic_long_run'] is False
          print('c13b numerical preflight PASS')
          PY

      - name: Package c13b preflight
        run: |
          set -euo pipefail
          cp mcmc_o3/C13B_27STEP_DRAG_PREDECLARED_20261009.json c13b_preflight/
          cp mcmc_o3/build_c13b_27step_sentinel.py c13b_preflight/
          cp mcmc_o3/audit_c13b_27step_sentinel.py c13b_preflight/
          cp c13b_preflight_build.log c13b_preflight/
          (cd c13b_preflight && find . -type f ! -name SHA256SUMS_PACKAGE.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_PACKAGE.txt && sha256sum -c SHA256SUMS_PACKAGE.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: rims-phaseii-o3-c13b-preflight
          path: c13b_preflight
          retention-days: 30

  sentinel:
    if: github.ref_name == 'rims-c13b-27step-drag-sentinel-20261009' && inputs.run_mode == 'sentinel'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rims-phaseii-o3-c13b-preflight
          path: c13b_preflight

      - name: Verify c13b preflight artifact
        run: (cd c13b_preflight && sha256sum -c SHA256SUMS_PACKAGE.txt)

      - name: Reconstruct pinned RIMS V18.29 CLASS source
        run: |
          set -euo pipefail
          cat rims_o3_patch/base_parts/part00 rims_o3_patch/base_parts/part01 rims_o3_patch/base_parts/part02_03 rims_o3_patch/base_parts/part04_05 rims_o3_patch/base_parts/part06 > rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          cat rims_o3_patch/delta_parts/part00_01 rims_o3_patch/delta_parts/part02_03 rims_o3_patch/delta_parts/part04 > rims_o3_patch/V18_23_TO_V18_29.patch
          test "$(sha256sum rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff | awk '{print $1}')" = "6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74"
          test "$(sha256sum rims_o3_patch/V18_23_TO_V18_29.patch | awk '{print $1}')" = "c322fb05b7414be9f88cf90ff0580694e7677c8da91d78a5480ea9cf10f2b8dc"
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          git apply ../rims_o3_patch/V18_23_TO_V18_29.patch
          git diff --check

      - name: Install CLASS and matched inference stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' 'numpy==2.5.3' scipy pandas pyyaml getdist 'arviz==0.22.0' mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public

      - name: Restore matched likelihood cache
        uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-o3-c10

      - name: Install or verify matched likelihood data
        run: cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages

      - name: Theory likelihood preflight
        run: |
          set -euo pipefail
          rm -rf chains_c13b
          cobaya-run c13b_preflight/rims_c13b_27step_4p0.yaml --test > c13b_test.log 2>&1
          rm -rf chains_c13b

      - name: Execute three corrected 27-step sentinels
        run: |
          set -euo pipefail
          mkdir -p chains_c13b
          for tag in 4p0 4p8 5p7; do
            set +e
            timeout --signal=INT --kill-after=45s 18m mpirun --oversubscribe -np 4 cobaya-run "c13b_preflight/rims_c13b_27step_${tag}.yaml" > "c13b_${tag}.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "c13b_${tag}_exit_code.txt"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then
              tail -200 "c13b_${tag}.log"
              exit "$rc"
            fi
            grep -F "Dragging with number of interpolating steps:" "c13b_${tag}.log"
            grep -F "* 27 : (['A_planck'],)" "c13b_${tag}.log"
          done

      - name: Audit and freeze c13b selection
        run: |
          set -euo pipefail
          python mcmc_o3/audit_c13b_27step_sentinel.py --work-dir . --out C13B_27STEP_SELECTION.json

      - name: Package c13b sentinel
        if: always()
        run: |
          OUT=c13b_sentinel_artifact
          rm -rf "$OUT" && mkdir "$OUT"
          cp C13B_27STEP_SELECTION.json "$OUT/" 2>/dev/null || true
          cp c13b_*.log c13b_*_exit_code.txt "$OUT/" 2>/dev/null || true
          cp c13b_preflight/C13B_27STEP_PREFLIGHT.json c13b_preflight/C13B_27STEP_DRAG_PREDECLARED_20261009.json c13b_preflight/rims_c13b_ridge_preserving.covmat "$OUT/" 2>/dev/null || true
          cp c13b_preflight/rims_c13b_27step_*.yaml "$OUT/" 2>/dev/null || true
          cp chains_c13b/rims_c13b_27step_* "$OUT/" 2>/dev/null || true
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-phaseii-o3-c13b-27step-drag-sentinel
          path: c13b_sentinel_artifact
          retention-days: 30
