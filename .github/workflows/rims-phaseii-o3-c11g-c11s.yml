name: RIMS Phase II O3 c11 geometry refresh and scale sentinel

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: rims-phaseii-o3-c11g-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-audit:
    if: github.head_ref == 'rims-c11g-c10t-audit-20261005'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit frozen c10t to c11g contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('mcmc_o3/C10T_POSTRUN_AUDIT_AND_C11G_DECISION_20261005.json').read_text())
          assert d['source_run_id']==37248887077
          assert d['source_artifact']['artifact_id']==11321815241
          assert d['c10t_execution']['eligible_for_inference'] is False
          n=d['c11g_predeclared_next_step']
          assert n['source_use']=='proposal-training-only'
          assert n['target_distribution_changed'] is False
          assert n['coordinate_map_changed'] is False
          assert n['within_chain_covariance_only'] is True
          assert n['chain_means_removed_before_pooling'] is True
          assert n['burnin_fraction']==0.30
          assert n['diagonal_shrinkage_candidates']==[0.15,0.20,0.25,0.30,0.35,0.40]
          assert n['sentinel_minutes_per_scale']==12
          assert n['sentinel_samples_eligible_for_inference'] is False
          assert n['automatic_long_run'] is False
          assert n['automatic_follow_on'] is False
          assert d['production_gate']['GetDist_Rminus1_lt']==0.01
          assert d['production_gate']['minimum_headline_ESS_ge']==1000.0
          print('c11g frozen contract PASS')
          PY

  geometry-audit:
    needs: contract-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover c10t artifact
        uses: actions/download-artifact@v4
        with:
          name: rims-phaseii-o3-rims-c10t
          path: c10t_source
          repository: ShujiMaruyama/glite-prelikelihood-protocol
          run-id: 37248887077
          github-token: ${{ github.token }}
      - name: Install deterministic audit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.3' scipy pyyaml 'getdist==1.7.7' 'arviz==0.22.0'
      - name: Repair c10t diagnostics and build c11 covariance
        run: |
          set -euo pipefail
          python mcmc_o3/build_c11_from_c10t.py --c10t-dir c10t_source --out-dir c11_geometry | tee c11_geometry_build.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('c11_geometry/C10U_REPAIRED_AUDIT_AND_C11_GEOMETRY.json').read_text())
          assert d['source_run_id']==37248887077
          assert d['source_eligible_for_inference'] is False
          assert d['c11_geometry']['target_distribution_changed'] is False
          assert d['c11_geometry']['coordinate_map_changed'] is False
          assert d['c11_geometry']['within_chain_only'] is True
          assert d['c11_geometry']['min_corr_eig']>=0.10
          assert d['c11_geometry']['corr_condition']<=25.0
          assert d['c11_geometry']['selected_diagonal_shrinkage'] in [0.15,0.20,0.25,0.30,0.35,0.40]
          assert len(d['c11s_predeclared_sentinel']['tested_scales'])==3
          assert d['c11s_predeclared_sentinel']['samples_eligible_for_inference'] is False
          assert d['c11s_predeclared_sentinel']['automatic_long_run'] is False
          assert d['GetDist_repaired']['error'] is None
          print('c11 geometry audit PASS')
          PY
      - name: Package c11 geometry audit
        run: |
          set -euo pipefail
          cp mcmc_o3/C10T_POSTRUN_AUDIT_AND_C11G_DECISION_20261005.json c11_geometry/
          cp mcmc_o3/build_c11_from_c10t.py c11_geometry/
          cp c11_geometry_build.log c11_geometry/
          (cd c11_geometry && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: rims-phaseii-o3-c11g-geometry
          path: c11_geometry
          retention-days: 30

  scale-sentinel:
    needs: geometry-audit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
      SENTINEL_MINUTES: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rims-phaseii-o3-c11g-geometry
          path: c11_geometry
      - name: Verify c11 geometry artifact
        run: |
          set -euo pipefail
          (cd c11_geometry && sha256sum -c SHA256SUMS.txt)
      - name: Reconstruct pinned RIMS V18.29 CLASS source
        run: |
          set -euo pipefail
          cat rims_o3_patch/base_parts/part00 rims_o3_patch/base_parts/part01 rims_o3_patch/base_parts/part02_03 rims_o3_patch/base_parts/part04_05 rims_o3_patch/base_parts/part06 > rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          cat rims_o3_patch/delta_parts/part00_01 rims_o3_patch/delta_parts/part02_03 rims_o3_patch/delta_parts/part04 > rims_o3_patch/V18_23_TO_V18_29.patch
          test "$(sha256sum rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff | awk '{print $1}')" = "6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74"
          test "$(sha256sum rims_o3_patch/V18_23_TO_V18_29.patch | awk '{print $1}')" = "c322fb05b7414be9f88cf90ff0580694e7677c8da91d78a5480ea9cf10f2b8dc"
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          git apply ../rims_o3_patch/V18_23_TO_V18_29.patch
          git diff --check
      - name: Install CLASS and matched inference stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' 'numpy==2.5.3' scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public
      - name: Restore matched likelihood cache
        uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-o3-c10
      - name: Install or verify matched likelihood data
        run: cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages
      - name: Theory and likelihood preflight
        run: |
          rm -rf chains_c11s
          cobaya-run c11_geometry/rims_exp_shell_c11_preconditioned.yaml --test
          rm -rf chains_c11s
      - name: Execute three disposable c11 scale sentinels
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,yaml
          from pathlib import Path
          d=json.loads(Path('c11_geometry/C10U_REPAIRED_AUDIT_AND_C11_GEOMETRY.json').read_text())
          base=yaml.safe_load(Path('c11_geometry/rims_exp_shell_c11_preconditioned.yaml').read_text())
          for scale in d['c11s_predeclared_sentinel']['tested_scales']:
              tag=('%.1f'%scale).replace('.','p')
              y=json.loads(json.dumps(base))
              y['output']=f'chains_c11s/rims_c11s_{tag}'
              y['sampler']['mcmc']['proposal_scale']=float(scale)
              y['sampler']['mcmc']['learn_proposal']=False
              Path(f'c11s_{tag}.yaml').write_text(yaml.safe_dump(y,sort_keys=False))
          PY
          for yaml in c11s_*.yaml; do
            tag="${yaml#c11s_}"; tag="${tag%.yaml}"
            set +e
            timeout --signal=INT --kill-after=45s "${SENTINEL_MINUTES}m" mpirun --oversubscribe -np 4 cobaya-run "$yaml" > "c11s_${tag}.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "c11s_${tag}_exit_code.txt"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then
              tail -150 "c11s_${tag}.log"
              exit "$rc"
            fi
          done
      - name: Audit and freeze c11 scale selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          src=json.loads(Path('c11_geometry/C10U_REPAIRED_AUDIT_AND_C11_GEOMETRY.json').read_text())
          records=[]
          for scale in src['c11s_predeclared_sentinel']['tested_scales']:
              tag=('%.1f'%scale).replace('.','p')
              chains={}; rows=0; weights=0.0
              for i in range(1,5):
                  p=Path('chains_c11s')/f'rims_c11s_{tag}.{i}.txt'
                  if not p.exists() or p.stat().st_size==0:
                      raise RuntimeError(p)
                  a=np.loadtxt(p); a=a[None,:] if a.ndim==1 else a
                  r=len(a); w=float(a[:,0].sum()); acc=float(r/w)
                  chains[str(i)]={'rows':int(r),'weight_sum':w,'acceptance':acc}
                  rows+=r; weights+=w
              agg=float(rows/weights)
              per=[x['acceptance'] for x in chains.values()]
              passed=(0.20<=agg<=0.50 and all(0.10<=x<=0.70 for x in per) and all(x['rows']>=10 for x in chains.values()))
              rec={'proposal_scale':float(scale),'aggregate_acceptance':agg,'chains':chains,'diagnostic_target_passed':passed,'eligible_for_inference':False}
              records.append(rec)
              Path(f'C11S_SENTINEL_{tag}.json').write_text(json.dumps(rec,indent=2,sort_keys=True))
          eligible=[r for r in records if r['diagnostic_target_passed']]
          selected=min((r['proposal_scale'] for r in eligible),default=None)
          out={
            'schema':'rims-phaseii-o3-c11s-selection-v1',
            'source_c10t_run_id':37248887077,
            'source_geometry_artifact':'rims-phaseii-o3-c11g-geometry',
            'role':'disposable_nonproduction_proposal_scale_diagnostic',
            'records':records,
            'selected_proposal_scale':selected,
            'selection_rule':src['c11s_predeclared_sentinel']['selection_rule'],
            'sentinel_samples_eligible_for_inference':False,
            'automatic_long_run':False,
            'automatic_follow_on':False,
            'production_gate':{'GetDist_Rminus1_lt':0.01,'minimum_headline_ESS_ge':1000.0},
            'claim_boundary':{'production_posterior':False,'Bayes_factor':False,'model_preference':False,'LambdaCDM_competitiveness_verified':False}
          }
          Path('C11S_SELECTION.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Package c11 sentinel audit
        if: always()
        run: |
          OUT=c11s_artifact
          rm -rf "$OUT" && mkdir "$OUT"
          cp C11S_*.json "$OUT/" 2>/dev/null || true
          cp c11s_*.yaml c11s_*.log c11s_*_exit_code.txt "$OUT/" 2>/dev/null || true
          cp c11_geometry/C10U_REPAIRED_AUDIT_AND_C11_GEOMETRY.json c11_geometry/rims_c11_precond.covmat c11_geometry/rims_c11_precond_meta.json "$OUT/" 2>/dev/null || true
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-phaseii-o3-c11s-scale-sentinel
          path: c11s_artifact
          retention-days: 30
