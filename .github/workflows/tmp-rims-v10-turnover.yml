name: temporary RIMS V10 turnover execution

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ tmp-rims-v10-turnover-run-20260729 ]

jobs:
  turnover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CLASS v3.3.4
        run: |
          git clone --depth 1 --branch v3.3.4 https://github.com/lesgourg/class_public.git class_public
          git -C class_public rev-parse HEAD | tee CLASS_UPSTREAM_COMMIT.txt
      - name: Materialize RIMS V7 patch and V10 run card
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > rims_class_v3.3.4_v7.patch
          echo '' | base64 -d | gzip -d > rims_v10_turnover.ini
          sha256sum rims_class_v3.3.4_v7.patch rims_v10_turnover.ini | tee INPUT_SHA256.txt
      - name: Apply patch and build
        shell: bash
        run: |
          set -o pipefail
          cd class_public
          git apply ../rims_class_v3.3.4_v7.patch
          make -j2 2>&1 | tee ../BUILD.log
      - name: Run dedicated turnover grid
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runs/v10_turnover
          cd class_public
          ./class ../rims_v10_turnover.ini > ../runs/v10_turnover/stdout.txt 2> ../runs/v10_turnover/stderr.txt
          test -s ../runs/v10_turnover/rims_v10_turnover__background.dat
          ls -lah ../runs/v10_turnover | tee ../RUN_FILES.txt
      - name: Package execution artifact
        shell: bash
        run: |
          cp rims_v10_turnover.ini runs/v10_turnover/
          cp rims_class_v3.3.4_v7.patch runs/v10_turnover/
          cp CLASS_UPSTREAM_COMMIT.txt INPUT_SHA256.txt BUILD.log RUN_FILES.txt runs/v10_turnover/
          find runs/v10_turnover -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > runs/v10_turnover/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rims-v10-turnover-results
          path: runs/v10_turnover/
          if-no-files-found: error
          retention-days: 7
