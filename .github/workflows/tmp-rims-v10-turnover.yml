name: temporary RIMS V10 turnover execution

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ tmp-rims-v10-turnover-run-20260729 ]

jobs:
  turnover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CLASS v3.3.4
        run: |
          git clone --depth 1 --branch v3.3.4 https://github.com/lesgourg/class_public.git class_public
          git -C class_public rev-parse HEAD | tee CLASS_UPSTREAM_COMMIT.txt
      - name: Materialize and verify RIMS inputs
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_rims_v10/patch.b64.* | tr -d '\n\r ' | base64 -d | gzip -d > rims_class_v3.3.4_v7.patch
          cat tmp_rims_v10/ini.b64 | tr -d '\n\r ' | base64 -d | gzip -d > rims_v10_turnover.ini
          echo '6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74  rims_class_v3.3.4_v7.patch' | sha256sum -c -
          echo '0cb8bdfed3963e3e8660f96b4359c513276e2eb538b404334d1ce398698d9082  rims_v10_turnover.ini' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rims_v10_turnover.ini')
          s=p.read_text()
          old='k_output_values = 2e-06, 3.5e-06, 6e-06, 1e-05, 1.5e-05, 2.2e-05, 3.2e-05, 4.6e-05, 6.5e-05, 9e-05, 0.00013, 0.0002, 0.00032, 0.0005, 0.001'
          new=old+', 0.01, 0.1'
          if old not in s:
              raise SystemExit('k_output_values line not found')
          p.write_text(s.replace(old,new))
          PY
          sha256sum rims_class_v3.3.4_v7.patch rims_v10_turnover.ini | tee INPUT_SHA256.txt
      - name: Apply patch and build
        shell: bash
        run: |
          set -euo pipefail
          cd class_public
          git apply ../rims_class_v3.3.4_v7.patch
          make -j2 2>&1 | tee ../BUILD.log
      - name: Run low-k through QS turnover diagnostic grid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/v10_turnover
          cd class_public
          ./class ../rims_v10_turnover.ini > ../runs/v10_turnover/stdout.txt 2> ../runs/v10_turnover/stderr.txt
          test -s ../runs/v10_turnover/rims_v10_turnover__background.dat
          ls -lah ../runs/v10_turnover | tee ../RUN_FILES.txt
      - name: Package execution artifact
        shell: bash
        run: |
          cp rims_v10_turnover.ini runs/v10_turnover/
          cp rims_class_v3.3.4_v7.patch runs/v10_turnover/
          cp CLASS_UPSTREAM_COMMIT.txt INPUT_SHA256.txt BUILD.log RUN_FILES.txt runs/v10_turnover/
          find runs/v10_turnover -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > runs/v10_turnover/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rims-v10-turnover-results
          path: runs/v10_turnover/
          if-no-files-found: error
          retention-days: 7
