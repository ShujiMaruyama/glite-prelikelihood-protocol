name: temporary RIMS MCMC fixed-ref init

on:
  pull_request:
    branches: [main]

jobs:
  rims:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Recover audited inference files
        run: |
          curl -L https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d/mcmc/rims.yaml -o rims.yaml
          curl -L https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d/mcmc/rims_exact.yaml -o rims_exact.yaml
          curl -L https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d/mcmc/analyze_chains.py -o analyze_chains.py
          curl -L https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d/rims_classy.py -o rims_classy.py
          mkdir -p mcmc
          mv rims.yaml mcmc/rims.yaml
          mv rims_exact.yaml mcmc/rims_exact.yaml
          mv analyze_chains.py mcmc/analyze_chains.py

      - name: Fix all chain starting coordinates only
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          p=Path('mcmc/rims.yaml')
          d=yaml.safe_load(p.read_text())
          refs={
            'H0':68.02239956,
            'omega_b':0.0224611661,
            'omega_dm':0.1185203994,
            'logA':3.0447838321,
            'n_s':0.9660499,
            'tau_reio':0.0544,
            'Omega_scf':0.1017248094,
            'rims_alpha_U':0.0613181089,
            'rims_phi_transition':20.091078,
          }
          for k,v in refs.items():
            d['params'][k]['ref']=v
          d['params']['A_planck']={
            'prior':{'dist':'norm','loc':1.0,'scale':0.0025},
            'ref':1.0,
            'proposal':0.0005,
            'latex':'A_{\\rm Planck}',
          }
          d['output']='chains/rims'
          p.write_text(yaml.safe_dump(d,sort_keys=False))
          print(p.read_text())
          PY

      - name: Recover pinned RIMS V7 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _patch_artifact
          gh run download 30425050547 -n rims-v10-turnover-results -D _patch_artifact
          cp _patch_artifact/rims_class_v3.3.4_v7.patch ./rims_class_v3.3.4_v7.patch

      - name: Build patched CLASS
        run: |
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_class_v3.3.4_v7.patch
          git rev-parse HEAD > ../CLASS_UPSTREAM_COMMIT.txt
          sha256sum ../rims_class_v3.3.4_v7.patch > ../PATCH_SHA256.txt
          cd ..
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' numpy scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public

      - uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-v1

      - name: Install likelihood data
        run: |
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages

      - name: Exact finite-point validation
        run: |
          cobaya-run mcmc/rims_exact.yaml --test

      - name: MCMC startup validation
        run: |
          cobaya-run mcmc/rims.yaml --test
          rm -rf chains

      - name: Run four-chain RIMS MCMC
        run: |
          set -o pipefail
          mkdir -p chains
          mpirun --oversubscribe -np 4 cobaya-run mcmc/rims.yaml 2>&1 | tee mcmc_rims.log

      - name: Analyze posterior
        if: success()
        run: |
          python mcmc/analyze_chains.py --model rims --root chains/rims --out analysis_rims

      - name: Package artifact
        if: always()
        run: |
          mkdir -p artifact
          cp CLASS_UPSTREAM_COMMIT.txt PATCH_SHA256.txt artifact/ || true
          cp mcmc/rims.yaml mcmc/rims_exact.yaml rims_classy.py mcmc/analyze_chains.py artifact/ || true
          cp mcmc_rims.log artifact/ || true
          cp -r chains artifact/ || true
          cp -r analysis_rims artifact/ || true
          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-full-mcmc-rims-fixedref
          path: artifact
          retention-days: 7
