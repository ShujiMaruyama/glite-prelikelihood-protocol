name: temporary RIMS exact logposterior diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Recover audited inference files
        run: |
          mkdir -p mcmc
          base=https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d
          curl -fsSL "$base/rims_classy.py" -o rims_classy.py
          curl -fsSL "$base/mcmc/rims.yaml" -o mcmc/rims.yaml
          curl -fsSL "$base/mcmc/rims_exact.yaml" -o mcmc/rims_exact.yaml

      - name: Recover pinned RIMS patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _patch_artifact
          gh run download 30425050547 -n rims-v10-turnover-results -D _patch_artifact
          cp _patch_artifact/rims_class_v3.3.4_v7.patch ./rims_class_v3.3.4_v7.patch

      - name: Build patched CLASS and install inference stack
        run: |
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_class_v3.3.4_v7.patch
          cd ..
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' numpy scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public

      - uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-v1

      - name: Install likelihood data
        run: |
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages

      - name: Direct MCMC-parameterization logposterior evaluation
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee direct_logposterior.log
          import json, traceback
          from cobaya.yaml import yaml_load_file
          from cobaya.model import get_model

          info = yaml_load_file('mcmc/rims.yaml')
          info.pop('sampler', None)
          info.pop('output', None)
          info['debug'] = True
          info['theory']['rims_classy.RIMSClassy']['stop_at_error'] = True
          model = get_model(info)
          point = {
              'H0': 68.02239956,
              'omega_b': 0.0224611661,
              'omega_dm': 0.1185203994,
              'logA': 3.044783832128357,
              'n_s': 0.9660499,
              'tau_reio': 0.0544,
              'Omega_scf': 0.1017248094,
              'rims_alpha_U': 0.0613181089,
              'rims_phi_transition': 20.091078,
              'A_planck': 1.0,
          }
          print('POINT', json.dumps(point, indent=2))
          result = model.logposterior(point, as_dict=True)
          print('RESULT', result)
          if not result or result.get('logpost', float('-inf')) == float('-inf'):
              raise SystemExit(3)
          PY

      - name: Direct fixed-parameter exact evaluator
        if: always()
        run: |
          set -o pipefail
          cobaya-run mcmc/rims_exact.yaml 2>&1 | tee exact_evaluate.log

      - name: Package diagnostic
        if: always()
        run: |
          mkdir -p artifact
          cp direct_logposterior.log exact_evaluate.log artifact/ 2>/dev/null || true
          cp mcmc/rims.yaml mcmc/rims_exact.yaml rims_classy.py artifact/ || true
          (cd artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-exact-logposterior-diagnostic
          path: artifact
          retention-days: 7
