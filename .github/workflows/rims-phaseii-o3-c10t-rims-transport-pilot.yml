name: RIMS Phase II O3 c10t RIMS selected-scale transport pilot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: rims-phaseii-o3-c10t-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-audit:
    if: github.head_ref == 'rims-c10t-rims-transport-pilot-20261005'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit frozen c10s selection and c10t contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('mcmc_o3/C10S_POSTRUN_AND_C10T_DECISION_20261005.json').read_text())
          assert d['source_run_id']==37246838213
          assert d['source_head_sha']=='7729ad31386abeb394a9c321675290b07c0d96d6'
          assert d['source_artifacts']['s28']['diagnostic_target_passed'] is False
          assert d['source_artifacts']['s34']['diagnostic_target_passed'] is True
          assert d['selection_decision']['selected_proposal_scale']==3.4
          assert d['selection_decision']['sentinel_samples_eligible_for_inference'] is False
          assert d['selection_decision']['automatic_long_run'] is False
          t=d['c10t_predeclared_next_step']
          assert t['role']=='bounded_nonproduction_rims_transport_pilot'
          assert t['model']=='rims'
          assert t['proposal_scale']==3.4
          assert t['minutes']==45
          assert t['fresh_four_MPI_chains'] is True
          assert t['burnin_fraction_for_diagnostics']==0.30
          assert t['target_distribution_changed'] is False
          assert t['coordinate_map_changed'] is False
          assert t['proposal_covariance_changed'] is False
          assert t['learn_proposal'] is False
          assert t['concatenate_c9_c10p0_or_c10s_samples'] is False
          assert t['automatic_follow_on'] is False
          assert t['production_posterior'] is False
          assert d['production_gate']['GetDist_Rminus1_lt']==0.01
          assert d['production_gate']['minimum_headline_ESS_ge']==1000.0
          print('c10t frozen-contract audit PASS')
          PY

  transport-pilot:
    needs: contract-audit
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
      PROPOSAL_SCALE: "3.4"
      CHAIN_ROOT: rims_c10t
      PILOT_MINUTES: "45"
      BURNIN_FRACTION: "0.30"
    steps:
      - uses: actions/checkout@v4

      - name: Recover frozen c10p0 RIMS geometry
        uses: actions/download-artifact@v4
        with:
          name: c10p0-geometry-rims
          path: c10_runtime
          repository: ShujiMaruyama/glite-prelikelihood-protocol
          run-id: 34445168396
          github-token: ${{ github.token }}

      - name: Verify geometry and bind selected scale to fresh output
        run: |
          set -euo pipefail
          (cd c10_runtime && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json,os,yaml
          from pathlib import Path
          meta=json.loads(Path('c10_runtime/rims_c10_precond_meta.json').read_text())
          assert meta['target_distribution_changed'] is False
          assert meta['coordinate_map_changed_from_c9'] is False
          assert meta['fresh_chains_required'] is True
          assert meta['c9_samples_concatenated_with_c10'] is False
          assert meta['canonical_cov_sha256']=='9a9c9e1a83c4e4c35191ef8ca7a50d5f0ad56ae74695b9937ab26040458559f6'
          p=Path('c10_runtime/rims_exp_shell_c10p0_preconditioned.yaml')
          d=yaml.safe_load(p.read_text())
          d['output']=f"chains_c10t/{os.environ['CHAIN_ROOT']}"
          d['sampler']['mcmc']['proposal_scale']=float(os.environ['PROPOSAL_SCALE'])
          d['sampler']['mcmc']['learn_proposal']=False
          Path('rims_c10t.yaml').write_text(yaml.safe_dump(d,sort_keys=False))
          PY

      - name: Reconstruct pinned RIMS V18.29 CLASS source
        run: |
          set -euo pipefail
          cat rims_o3_patch/base_parts/part00 rims_o3_patch/base_parts/part01 rims_o3_patch/base_parts/part02_03 rims_o3_patch/base_parts/part04_05 rims_o3_patch/base_parts/part06 > rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          cat rims_o3_patch/delta_parts/part00_01 rims_o3_patch/delta_parts/part02_03 rims_o3_patch/delta_parts/part04 > rims_o3_patch/V18_23_TO_V18_29.patch
          test "$(sha256sum rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff | awk '{print $1}')" = "6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74"
          test "$(sha256sum rims_o3_patch/V18_23_TO_V18_29.patch | awk '{print $1}')" = "c322fb05b7414be9f88cf90ff0580694e7677c8da91d78a5480ea9cf10f2b8dc"
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          git apply ../rims_o3_patch/V18_23_TO_V18_29.patch
          git diff --check

      - name: Install CLASS and diagnostic stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' 'numpy==2.5.3' scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2' 'arviz==0.22.0'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public

      - name: Restore matched likelihood cache
        uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-o3-c10

      - name: Install or verify matched likelihood data
        run: cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages

      - name: Theory and likelihood preflight
        run: |
          rm -rf chains_c10t
          cobaya-run rims_c10t.yaml --test
          rm -rf chains_c10t

      - name: Execute fresh four-chain bounded transport pilot
        run: |
          set +e
          timeout --signal=INT --kill-after=45s "${PILOT_MINUTES}m" \
            mpirun --oversubscribe -np 4 cobaya-run rims_c10t.yaml \
            > c10t.log 2>&1
          rc=$?
          set -e
          echo "$rc" > c10t_exit_code.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then
            tail -250 c10t.log
            exit "$rc"
          fi
          for i in 1 2 3 4; do test -s "chains_c10t/${CHAIN_ROOT}.${i}.txt"; done

      - name: Audit transport without promoting inference
        run: |
          python - <<'PY'
          import json,math,os
          from pathlib import Path
          import numpy as np
          import arviz as az
          from getdist import loadMCSamples

          root=Path('chains_c10t')/os.environ['CHAIN_ROOT']
          burn=float(os.environ['BURNIN_FRACTION'])
          headline=['q_H','omega_b','omega_dm','logA','n_s','tau_reio','Omega_scf','rims_alpha_U','rims_shell_u_i','A_planck']

          param_path=Path(str(root)+'.paramnames')
          names=[]
          for line in param_path.read_text().splitlines():
              line=line.strip()
              if line and not line.startswith('#'):
                  names.append(line.split()[0].rstrip('*'))
          index={n:i for i,n in enumerate(names)}
          used=[n for n in headline if n in index]
          if len(used)<8:
              raise RuntimeError(f'headline parameter map incomplete: {used}')

          rows=0; weights=0.; chains={}; expanded=[]
          for ci in range(1,5):
              p=Path(str(root)+f'.{ci}.txt')
              a=np.loadtxt(p); a=a[None,:] if a.ndim==1 else a
              if a.shape[1] != 2+len(names):
                  raise RuntimeError((p,a.shape,len(names)))
              w=np.rint(a[:,0]).astype(int)
              if np.max(np.abs(a[:,0]-w))>1e-8 or np.any(w<1):
                  raise RuntimeError(f'non-integer or invalid MCMC weights in chain {ci}')
              r=len(a); ws=int(w.sum()); acc=float(r/ws)
              rows+=r; weights+=ws
              chains[str(ci)]={'rows':int(r),'weight_sum':ws,'acceptance':acc}
              steps=np.repeat(a[:,2:],w,axis=0)
              cut=int(math.floor(burn*len(steps)))
              retained=steps[cut:]
              if len(retained)<20:
                  raise RuntimeError(f'too few retained reconstructed steps in chain {ci}: {len(retained)}')
              expanded.append(retained)

          aggregate=float(rows/weights)
          min_draws=min(len(x) for x in expanded)
          equalized=[x[-min_draws:] for x in expanded]

          rank_diag={}
          for name in used:
              j=index[name]
              arr=np.stack([x[:,j] for x in equalized],axis=0)
              rhat=float(np.asarray(az.rhat(arr,method='rank')))
              bulk=float(np.asarray(az.ess(arr,method='bulk')))
              tail=float(np.asarray(az.ess(arr,method='tail',prob=(0.05,0.95))))
              drifts=[]
              for x in expanded:
                  v=x[:,j]
                  h=len(v)//2
                  sd=float(np.std(v,ddof=1))
                  drift=float(abs(np.mean(v[-h:])-np.mean(v[:h]))/sd) if sd>0 else 0.0
                  drifts.append(drift)
              rank_diag[name]={
                  'rank_normalized_Rhat':rhat,
                  'bulk_ESS':bulk,
                  'tail_ESS':tail,
                  'max_abs_half_chain_drift_sigma':max(drifts)
              }

          getdist_diag={'error':None}
          try:
              s=loadMCSamples(str(root),settings={'ignore_rows':burn})
              gd_r=float(s.getGelmanRubin())
              gd_ess={}
              for name in used:
                  if name in s.index:
                      gd_ess[name]=float(s.getEffectiveSamples(s.index[name]))
              getdist_diag={
                  'GetDist_Rminus1':gd_r,
                  'parameter_ESS':gd_ess,
                  'minimum_parameter_ESS':min(gd_ess.values()) if gd_ess else None,
                  'error':None
              }
          except Exception as e:
              getdist_diag={'error':repr(e)}

          worst_rhat=max(rank_diag.items(),key=lambda kv:kv[1]['rank_normalized_Rhat'])
          worst_bulk=min(rank_diag.items(),key=lambda kv:kv[1]['bulk_ESS'])
          worst_tail=min(rank_diag.items(),key=lambda kv:kv[1]['tail_ESS'])
          worst_drift=max(rank_diag.items(),key=lambda kv:kv[1]['max_abs_half_chain_drift_sigma'])

          out={
            'schema':'rims-phaseii-o3-c10t-rims-transport-diagnostic-v1',
            'role':'bounded_nonproduction_rims_transport_pilot',
            'proposal_scale':float(os.environ['PROPOSAL_SCALE']),
            'minutes':int(os.environ['PILOT_MINUTES']),
            'burnin_fraction':burn,
            'rows':rows,'weight_sum':weights,'aggregate_acceptance':aggregate,
            'chains':chains,
            'equalized_reconstructed_draws_per_chain':min_draws,
            'headline_parameters':used,
            'GetDist':getdist_diag,
            'rank_normalized':rank_diag,
            'worst_rank_Rhat':{'parameter':worst_rhat[0],**worst_rhat[1]},
            'minimum_bulk_ESS':{'parameter':worst_bulk[0],**worst_bulk[1]},
            'minimum_tail_ESS':{'parameter':worst_tail[0],**worst_tail[1]},
            'worst_half_chain_drift':{'parameter':worst_drift[0],**worst_drift[1]},
            'target_distribution_changed':False,
            'coordinate_map_changed':False,
            'proposal_covariance_changed':False,
            'sentinel_samples_concatenated':False,
            'eligible_for_inference':False,
            'automatic_follow_on_forbidden':True,
            'production_gate':{'GetDist_Rminus1_lt':0.01,'minimum_headline_ESS_ge':1000.0}
          }
          Path('C10T_RIMS_TRANSPORT_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Package auditable c10t transport pilot
        if: always()
        run: |
          OUT=artifact_c10t
          rm -rf "$OUT" && mkdir "$OUT"
          cp rims_c10t.yaml c10t.log c10t_exit_code.txt "$OUT/" 2>/dev/null || true
          cp C10T_RIMS_TRANSPORT_DIAGNOSTIC.json "$OUT/" 2>/dev/null || true
          cp mcmc_o3/C10S_POSTRUN_AND_C10T_DECISION_20261005.json "$OUT/"
          cp c10_runtime/rims_c10_precond.covmat c10_runtime/rims_c10_precond_meta.json "$OUT/" 2>/dev/null || true
          cp chains_c10t/${CHAIN_ROOT}.* "$OUT/" 2>/dev/null || true
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-phaseii-o3-rims-c10t
          path: artifact_c10t
          retention-days: 30
