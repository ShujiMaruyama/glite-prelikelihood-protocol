name: RIMS c35 controlled mass-curvature sign pair (manual only)
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Static-only default; pair-2 runs one non-MCMC CLASS background"
        required: true
        type: choice
        default: static-only
        options:
          - static-only
          - pair-2
permissions:
  contents: read
concurrency:
  group: rims-c35-${{ github.ref }}-${{ inputs.run_mode }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENMPI_MCA_btl_vader_single_copy_mechanism: none
  PYTHONUNBUFFERED: 1

jobs:
  static-check:
    if: github.ref_name == 'rims-c35-frozen-occupancy-contrast-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install small offline test environment
        run: python -m pip install 'pytest>=8,<10' 'numpy==2.5.3'
      - name: Verify frozen c23 design, execute native-free regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c35_artifacts
          python -m compileall -q mcmc_o3/c24
          python mcmc_o3/c24/c23_freeze.py --output c35_artifacts/C23_FROZEN_81.json
          python - <<'PY'
          import json
          x=json.load(open('c35_artifacts/C23_FROZEN_81.json'))
          assert x['freeze_hash']=='0893eb71e09208c2579652d405f54277647f92ce1de33ee8a0e492ce2547cda0'
          assert len(x['cases'])==81
          print('EXACT C23 FROZEN 81 INPUT DESIGN: PASS, PHYSICAL RUN COUNT=0')
          PY
          python -m pytest -q mcmc_o3/c24/test_c24.py mcmc_o3/c24/test_c25.py mcmc_o3/c24/test_c26_occupancy_gate.py mcmc_o3/c24/test_c26_native_receipt_bridge.py mcmc_o3/c24/test_c27_history_integrity.py mcmc_o3/c24/test_c27_runner_integration.py mcmc_o3/c24/test_c28_background_input.py mcmc_o3/c24/test_c29_ic_parser_regression.py mcmc_o3/c24/test_c30_stability_column.py mcmc_o3/c24/test_c32_bracketed_endpoint.py mcmc_o3/test_c35_frozen_pair.py | tee c35_artifacts/static_pytest.txt
          python mcmc_o3/c35_frozen_pair_run.py --manifest c35_artifacts/C23_FROZEN_81.json --plan-only --output c35_artifacts/c35_locked_pair_plan.json
          (cd c35_artifacts && sha256sum C23_FROZEN_81.json static_pytest.txt c35_locked_pair_plan.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-c35-static-audit
          path: c35_artifacts
          retention-days: 30

  frozen-occupancy-pair:
    if: github.ref_name == 'rims-c35-frozen-occupancy-contrast-20261026' && inputs.run_mode == 'pair-2'
    needs: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify precisely two unrepeated frozen non-MCMC physical backgrounds
        run: |
          set -euo pipefail
          test "${{ inputs.run_mode }}" = "pair-2"
          python mcmc_o3/c24/c23_freeze.py --output C23_FROZEN_81.json
          python mcmc_o3/c35_frozen_pair_run.py --manifest C23_FROZEN_81.json --plan-only --output c35_frozen_execution_plan.json
          grep -q 'INPUT_DESIGN_ONLY_NO_PHYSICAL_TRAJECTORIES' C23_FROZEN_81.json
      - name: Pin and patch CLASS V18.29
        shell: bash
        run: |
          set -euo pipefail
          cat rims_o3_patch/base_parts/part00 rims_o3_patch/base_parts/part01 rims_o3_patch/base_parts/part02_03 rims_o3_patch/base_parts/part04_05 rims_o3_patch/base_parts/part06 > rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          cat rims_o3_patch/delta_parts/part00_01 rims_o3_patch/delta_parts/part02_03 rims_o3_patch/delta_parts/part04 > rims_o3_patch/V18_23_TO_V18_29.patch
          echo '6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74  rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff' | sha256sum -c -
          echo 'c322fb05b7414be9f88cf90ff0580694e7677c8da91d78a5480ea9cf10f2b8dc  rims_o3_patch/V18_23_TO_V18_29.patch' | sha256sum -c -
          git clone https://github.com/lesgourg/class_public.git class_public
          git -C class_public checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          (cd class_public && git apply ../rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff && git apply ../rims_o3_patch/V18_23_TO_V18_29.patch && git diff --check)
      - name: Install pinned native CLASS runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' 'numpy==2.5.3' scipy
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public
      - name: Execute precisely the two new frozen occupations, retaining failures
        shell: bash
        run: |
          set -euo pipefail
          python mcmc_o3/c35_frozen_pair_run.py \
            --manifest C23_FROZEN_81.json \
            --output c35_results \
            --runner mcmc_o3/c24/c24_native_background.py \
            --class-source class_public \
            --base-patch rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff \
            --delta-patch rims_o3_patch/V18_23_TO_V18_29.patch \
            --timeout-seconds 600

      - name: Independently classify every attempted source without claiming model viability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f c35_results/c35_attempt_ledger.json && test -f C23_FROZEN_81.json; then
            python mcmc_o3/c35_pair_audit.py \
              --manifest C23_FROZEN_81.json \
              --results c35_results \
              --out c35_results/c35_pair_independent_audit.json
          else
            echo "::error::Frozen pair attempt ledger missing; do NOT mark physical comparison complete"
            exit 3
          fi

      - name: Package complete evidence, including failure paths
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p c35_results
          cp C23_FROZEN_81.json c35_results/ 2>/dev/null
          (cd c35_results && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-c35-two-frozen-native-backgrounds
          path: c35_results
          retention-days: 30
