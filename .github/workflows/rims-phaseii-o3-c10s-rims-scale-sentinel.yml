name: RIMS Phase II O3 c10s RIMS proposal-scale sentinel sweep

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: rims-phaseii-o3-c10s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-audit:
    if: github.head_ref == 'rims-c10s-rims-scale-sentinel-20261005'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit frozen c10s contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mcmc_o3/C10P0_POSTRUN_AUDIT_AND_C10S_DECISION_20261005.json')
          d=json.loads(p.read_text())
          s=d['c10s_predeclared_next_step']
          assert s['role']=='disposable_rims_proposal_scale_sentinel_sweep_only'
          assert s['model']=='rims'
          assert s['target_distribution_changed'] is False
          assert s['coordinate_map_changed'] is False
          assert s['proposal_covariance_changed'] is False
          assert s['proposal_scales']==[2.8,3.4]
          assert s['minutes_per_scale']==15
          assert s['sentinel_samples_must_not_be_used_for_inference'] is True
          assert s['automatic_90min_pilot_after_sweep'] is False
          assert s['automatic_follow_on'] is False
          assert d['production_gate']['GetDist_Rminus1_lt']==0.01
          assert d['production_gate']['minimum_headline_ESS_ge']==1000.0
          print('c10s contract PASS')
          PY

  sentinel:
    needs: contract-audit
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - proposal_scale: 2.8
            tag: s28
          - proposal_scale: 3.4
            tag: s34
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
      PROPOSAL_SCALE: ${{ matrix.proposal_scale }}
      TAG: ${{ matrix.tag }}
      CHAIN_ROOT: rims_c10s_${{ matrix.tag }}
      SENTINEL_MINUTES: 15
    steps:
      - uses: actions/checkout@v4

      - name: Recover frozen c10p0 RIMS geometry
        uses: actions/download-artifact@v4
        with:
          name: c10p0-geometry-rims
          path: c10_runtime
          repository: ShujiMaruyama/glite-prelikelihood-protocol
          run-id: 34445168396
          github-token: ${{ github.token }}

      - name: Verify geometry and bind scale-specific disposable YAML
        run: |
          set -euo pipefail
          (cd c10_runtime && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json,os,yaml
          from pathlib import Path
          meta=json.loads(Path('c10_runtime/rims_c10_precond_meta.json').read_text())
          assert meta['target_distribution_changed'] is False
          assert meta['coordinate_map_changed_from_c9'] is False
          assert meta['canonical_cov_sha256']=='9a9c9e1a83c4e4c35191ef8ca7a50d5f0ad56ae74695b9937ab26040458559f6'
          p=Path('c10_runtime/rims_exp_shell_c10p0_preconditioned.yaml')
          d=yaml.safe_load(p.read_text())
          d['output']=f"sentinel_c10s/{os.environ['CHAIN_ROOT']}"
          d['sampler']['mcmc']['proposal_scale']=float(os.environ['PROPOSAL_SCALE'])
          d['sampler']['mcmc']['learn_proposal']=False
          out=Path(f"rims_c10s_{os.environ['TAG']}.yaml")
          out.write_text(yaml.safe_dump(d,sort_keys=False))
          print(out)
          PY

      - name: Reconstruct pinned RIMS V18.29 CLASS source
        run: |
          set -euo pipefail
          cat rims_o3_patch/base_parts/part00 rims_o3_patch/base_parts/part01 rims_o3_patch/base_parts/part02_03 rims_o3_patch/base_parts/part04_05 rims_o3_patch/base_parts/part06 > rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          cat rims_o3_patch/delta_parts/part00_01 rims_o3_patch/delta_parts/part02_03 rims_o3_patch/delta_parts/part04 > rims_o3_patch/V18_23_TO_V18_29.patch
          test "$(sha256sum rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff | awk '{print $1}')" = "6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74"
          test "$(sha256sum rims_o3_patch/V18_23_TO_V18_29.patch | awk '{print $1}')" = "c322fb05b7414be9f88cf90ff0580694e7677c8da91d78a5480ea9cf10f2b8dc"
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          git apply ../rims_o3_patch/V18_23_TO_V18_29.patch
          git diff --check

      - name: Install CLASS and inference stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' 'numpy==2.5.3' scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public

      - name: Restore matched likelihood cache
        uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-o3-c10

      - name: Install or verify matched likelihood data
        run: cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages

      - name: Theory and likelihood preflight
        run: |
          rm -rf sentinel_c10s
          cobaya-run "rims_c10s_${TAG}.yaml" --test
          rm -rf sentinel_c10s

      - name: Execute disposable four-chain sentinel
        run: |
          set +e
          timeout --signal=INT --kill-after=45s "${SENTINEL_MINUTES}m" \
            mpirun --oversubscribe -np 4 cobaya-run "rims_c10s_${TAG}.yaml" \
            > "c10s_${TAG}.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "c10s_${TAG}_exit_code.txt"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then
            tail -200 "c10s_${TAG}.log"
            exit "$rc"
          fi
          for i in 1 2 3 4; do test -s "sentinel_c10s/${CHAIN_ROOT}.${i}.txt"; done

      - name: Audit acceptance without promoting inference
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import numpy as np
          rows=0; weights=0.; chains={}
          for i in range(1,5):
              p=Path('sentinel_c10s')/f"{os.environ['CHAIN_ROOT']}.{i}.txt"
              a=np.loadtxt(p); a=a[None,:] if a.ndim==1 else a
              r=len(a); w=float(a[:,0].sum()); acc=float(r/w)
              rows+=r; weights+=w
              chains[str(i)]={'rows':int(r),'weight_sum':w,'acceptance':acc}
          aggregate=float(rows/weights)
          per=[v['acceptance'] for v in chains.values()]
          target=(0.20<=aggregate<=0.50 and all(0.10<=x<=0.70 for x in per) and all(v['rows']>=10 for v in chains.values()))
          out={
            'schema':'rims-phaseii-o3-c10s-rims-scale-sentinel-v1',
            'role':'disposable_nonproduction_proposal_scale_diagnostic',
            'proposal_scale':float(os.environ['PROPOSAL_SCALE']),
            'rows':rows,'weight_sum':weights,'aggregate_acceptance':aggregate,
            'chains':chains,'diagnostic_target_passed':target,
            'target_distribution_changed':False,
            'proposal_covariance_changed':False,
            'eligible_for_inference':False,
            'automatic_follow_on_forbidden':True
          }
          Path(f'C10S_RIMS_SENTINEL_{os.environ["TAG"]}.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Package auditable disposable sentinel
        if: always()
        run: |
          OUT="artifact_c10s_${TAG}"
          rm -rf "$OUT" && mkdir "$OUT"
          cp "rims_c10s_${TAG}.yaml" "c10s_${TAG}.log" "c10s_${TAG}_exit_code.txt" "$OUT/" 2>/dev/null || true
          cp "C10S_RIMS_SENTINEL_${TAG}.json" "$OUT/" 2>/dev/null || true
          cp c10_runtime/rims_c10_precond.covmat c10_runtime/rims_c10_precond_meta.json "$OUT/" 2>/dev/null || true
          cp mcmc_o3/C10P0_POSTRUN_AUDIT_AND_C10S_DECISION_20261005.json "$OUT/"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-phaseii-o3-c10s-${{ matrix.tag }}
          path: artifact_c10s_${{ matrix.tag }}
          retention-days: 30
