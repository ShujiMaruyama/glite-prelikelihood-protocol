name: RIMS Phase II O3 c13 full-drag scale sentinel

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Safety default is preflight-only; sentinel executes bounded nonproduction full-drag diagnostics"
        required: true
        type: choice
        default: preflight-only
        options:
          - preflight-only
          - sentinel

permissions:
  contents: read
  actions: read

concurrency:
  group: rims-phaseii-o3-c13-${{ github.ref }}-${{ inputs.run_mode }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  PYTHONUNBUFFERED: 1

jobs:
  preflight:
    if: github.ref_name == 'rims-c13-full-drag-sentinel-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit frozen c13 contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('mcmc_o3/C13_FULL_DRAG_PREDECLARED_20261009.json').read_text())
          assert d['source']['run_id']==37874107719
          assert d['source']['artifact_id']==11593256251
          assert d['source']['eligible_for_inference'] is False
          assert d['intervention']['target_distribution_changed'] is False
          assert d['intervention']['coordinate_map_changed'] is False
          assert d['intervention']['oversample_power']==1.0
          assert d['intervention']['tested_proposal_scales']==[5.7,7.0,8.2]
          assert d['automatic_follow_on'] is False
          assert d['automatic_long_run'] is False
          assert d['sentinel_samples_eligible_for_inference'] is False
          assert d['production_gate']['GetDist_Rminus1_lt']==0.01
          assert d['production_gate']['minimum_headline_ESS_ge']==1000.0
          print('c13 frozen contract PASS')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: rims-phaseii-o3-c12-drag-ridge
          path: c12_source
          repository: ShujiMaruyama/glite-prelikelihood-protocol
          run-id: 37874107719
          github-token: ${{ github.token }}
      - name: Build c13 full-drag sentinel inputs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.3' pyyaml
          python mcmc_o3/build_c13_full_drag_sentinel.py --c12-dir c12_source --out-dir c13_preflight | tee c13_preflight_build.log
          (cd c13_preflight && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('c13_preflight/C13_FULL_DRAG_PREFLIGHT.json').read_text())
          assert d['source_samples_eligible_for_inference'] is False
          assert d['target_distribution_changed'] is False
          assert d['coordinate_map_changed'] is False
          assert d['proposal_covariance_changed_from_c12_drag_ridge'] is False
          assert d['oversample_power']==1.0
          assert d['tested_scales']==[5.7,7.0,8.2]
          assert d['automatic_follow_on'] is False
          assert d['automatic_long_run'] is False
          print('c13 numerical preflight PASS')
          PY
      - name: Package c13 preflight
        run: |
          set -euo pipefail
          cp mcmc_o3/C13_FULL_DRAG_PREDECLARED_20261009.json c13_preflight/
          cp mcmc_o3/build_c13_full_drag_sentinel.py c13_preflight/
          cp mcmc_o3/audit_c13_sentinel.py c13_preflight/
          cp c13_preflight_build.log c13_preflight/
          (cd c13_preflight && find . -type f ! -name SHA256SUMS_PACKAGE.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_PACKAGE.txt && sha256sum -c SHA256SUMS_PACKAGE.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: rims-phaseii-o3-c13-preflight
          path: c13_preflight
          retention-days: 30

  sentinel:
    if: github.ref_name == 'rims-c13-full-drag-sentinel-20261009' && inputs.run_mode == 'sentinel'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rims-phaseii-o3-c13-preflight
          path: c13_preflight
      - name: Verify c13 preflight artifact
        run: (cd c13_preflight && sha256sum -c SHA256SUMS_PACKAGE.txt)
      - name: Reconstruct pinned RIMS V18.29 CLASS source
        run: |
          set -euo pipefail
          cat rims_o3_patch/base_parts/part00 rims_o3_patch/base_parts/part01 rims_o3_patch/base_parts/part02_03 rims_o3_patch/base_parts/part04_05 rims_o3_patch/base_parts/part06 > rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          cat rims_o3_patch/delta_parts/part00_01 rims_o3_patch/delta_parts/part02_03 rims_o3_patch/delta_parts/part04 > rims_o3_patch/V18_23_TO_V18_29.patch
          test "$(sha256sum rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff | awk '{print $1}')" = "6bb31d11bf17c300666a2c2f2b79cac42aeef0a99e9ea53cf3db87403592ad74"
          test "$(sha256sum rims_o3_patch/V18_23_TO_V18_29.patch | awk '{print $1}')" = "c322fb05b7414be9f88cf90ff0580694e7677c8da91d78a5480ea9cf10f2b8dc"
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_o3_patch/V18_23_LOCAL_RIMS_PATCH.diff
          git apply ../rims_o3_patch/V18_23_TO_V18_29.patch
          git diff --check
      - name: Install CLASS and matched inference stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' 'numpy==2.5.3' scipy pandas pyyaml getdist 'arviz==0.22.0' mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public
      - name: Restore matched likelihood cache
        uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-o3-c10
      - name: Install or verify matched likelihood data
        run: cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages
      - name: Theory likelihood and full-drag preflight
        run: |
          set -euo pipefail
          rm -rf chains_c13
          cobaya-run c13_preflight/rims_c13_full_drag_5p7.yaml --test > c13_test.log 2>&1
          rm -rf chains_c13
      - name: Execute three bounded full-drag sentinels
        run: |
          set -euo pipefail
          mkdir -p chains_c13
          for tag in 5p7 7p0 8p2; do
            set +e
            timeout --signal=INT --kill-after=45s 18m mpirun --oversubscribe -np 4 cobaya-run "c13_preflight/rims_c13_full_drag_${tag}.yaml" > "c13_${tag}.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "c13_${tag}_exit_code.txt"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then
              tail -200 "c13_${tag}.log"
              exit "$rc"
            fi
            grep -F "Dragging with number of interpolating steps:" "c13_${tag}.log"
            grep -F "* 27 : (['A_planck'],)" "c13_${tag}.log"
          done
      - name: Audit and freeze c13 selection
        run: |
          set -euo pipefail
          python mcmc_o3/audit_c13_sentinel.py --work-dir . --out C13_FULL_DRAG_SELECTION.json
      - name: Package c13 sentinel
        if: always()
        run: |
          OUT=c13_sentinel_artifact
          rm -rf "$OUT" && mkdir "$OUT"
          cp C13_FULL_DRAG_SELECTION.json "$OUT/" 2>/dev/null || true
          cp c13_*.log c13_*_exit_code.txt "$OUT/" 2>/dev/null || true
          cp c13_preflight/C13_FULL_DRAG_PREFLIGHT.json c13_preflight/C13_FULL_DRAG_PREDECLARED_20261009.json c13_preflight/rims_c13_ridge_preserving.covmat "$OUT/" 2>/dev/null || true
          cp c13_preflight/rims_c13_full_drag_*.yaml "$OUT/" 2>/dev/null || true
          cp chains_c13/rims_c13_full_drag_* "$OUT/" 2>/dev/null || true
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-phaseii-o3-c13-full-drag-sentinel
          path: c13_sentinel_artifact
          retention-days: 30
