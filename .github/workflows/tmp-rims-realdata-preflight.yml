name: temporary RIMS real-data preflight
on:
  push:
    branches:
      - tmp-rims-realdata-preflight-20260729
  pull_request:
    branches:
      - main
jobs:
  realdata_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recover pinned RIMS patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _patch_artifact
          gh run download 30425050547 -n rims-v10-turnover-results -D _patch_artifact
          cp _patch_artifact/rims_class_v3.3.4_v7.patch ./rims_class_v3.3.4_v7.patch
      - name: Install Cobaya and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cobaya==3.6.2' cython scipy
      - name: Build patched CLASS v3.3.4
        run: |
          git clone --depth 1 https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_class_v3.3.4_v7.patch
          PYTHON=python3 make -j2
          git rev-parse HEAD > ../CLASS_UPSTREAM_COMMIT.txt
          sha256sum ../rims_class_v3.3.4_v7.patch > ../PATCH_SHA256.txt
      - name: Install Planck 2018, DESI DR2 BAO and Pantheon+ likelihood data
        run: |
          mkdir -p cobaya_packages
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lensing.native bao.desi_dr2 sn.pantheonplus -p "$PWD/cobaya_packages"
      - name: Execute Planck plus BAO plus SN point gate
        shell: bash
        run: |
          set -o pipefail
          python rims_planck_point_gate.py 2>&1 | tee PLANCK_POINT_GATE.log
      - name: Package artifact
        if: always()
        run: |
          mkdir -p artifact
          cp CLASS_UPSTREAM_COMMIT.txt PATCH_SHA256.txt PLANCK_POINT_GATE.log artifact/ 2>/dev/null || true
          cp -r planck_gate_results/* artifact/ 2>/dev/null || true
          cp rims_planck_point_gate.py artifact/ || true
          python - <<'PY'
          import json, subprocess, pathlib
          pathlib.Path('artifact/ENVIRONMENT.json').write_text(json.dumps({'python':subprocess.getoutput('python --version'),'pip_freeze':subprocess.getoutput('pip freeze')},indent=2))
          PY
          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rims-planck-point-gate-results
          path: artifact
          retention-days: 7
