name: temporary RIMS reference diagnostic push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-rims-refdiag-push.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Recover audited inference files
        run: |
          curl -L https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d/mcmc/rims.yaml -o rims.yaml
          curl -L https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d/mcmc/rims_exact.yaml -o rims_exact.yaml
          curl -L https://raw.githubusercontent.com/ShujiMaruyama/glite-prelikelihood-protocol/ed4cffb222936a2cfd207204e6df4782e4cce50d/rims_classy.py -o rims_classy.py
          mkdir -p mcmc
          mv rims.yaml mcmc/rims.yaml
          mv rims_exact.yaml mcmc/rims_exact.yaml
      - name: Recover pinned RIMS V7 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _patch_artifact
          gh run download 30425050547 -n rims-v10-turnover-results -D _patch_artifact
          cp _patch_artifact/rims_class_v3.3.4_v7.patch ./rims_class_v3.3.4_v7.patch
      - name: Build patched CLASS and inference stack
        run: |
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git apply ../rims_class_v3.3.4_v7.patch
          cd ..
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install 'cython<4' numpy scipy pandas pyyaml getdist mpi4py 'cobaya==3.6.2'
          (cd class_public && python setup.py build)
          python -m pip install -e ./class_public
      - uses: actions/cache@v4
        with:
          path: packages
          key: cobaya-3.6.2-planck2018-desi-dr2-pantheonplus-v1
      - name: Install likelihood data
        run: |
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native bao.desi_dr2 sn.pantheonplus -p packages
      - name: Actual exact RIMS evaluate
        run: |
          set -o pipefail
          cobaya-run mcmc/rims_exact.yaml 2>&1 | tee exact_evaluate.log
      - name: Sampled-parameter point diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json, math, yaml, traceback
          from pathlib import Path
          from cobaya.model import get_model
          from cobaya.input import update_info
          raw=yaml.safe_load(Path('mcmc/rims.yaml').read_text()); raw.pop('sampler',None); raw.pop('output',None)
          model=get_model(update_info(raw))
          point={'H0':68.02239956,'omega_b':0.0224611661,'omega_dm':0.1185203994,'logA':math.log(21.00549),'n_s':0.9660499,'tau_reio':0.0544,'Omega_scf':0.1017248094,'rims_alpha_U':0.0613181089,'rims_phi_transition':20.091078}
          sampled=list(model.parameterization.sampled_params())
          if 'A_planck' in sampled: point['A_planck']=1.0
          rec={'sampled':sampled,'point':point,'likelihood_names':list(model.likelihood)}
          try:
            p=model.logposterior(point,cached=False)
            rec.update(logpost=float(p.logpost),logpriors=[float(x) for x in p.logpriors],loglikes=[float(x) for x in p.loglikes])
          except Exception as e:
            rec.update(error=repr(e),traceback=traceback.format_exc())
          Path('RIMS_REF_DIAGNOSTIC.json').write_text(json.dumps(rec,indent=2))
          print(json.dumps(rec,indent=2))
          PY
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rims-reference-diagnostic-push
          path: |
            exact_evaluate.log
            RIMS_REF_DIAGNOSTIC.json
            chains/rims_exact.*
          retention-days: 7
