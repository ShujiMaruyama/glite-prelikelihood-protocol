packages_path: packages
output: chains_c8/scalar_c8

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE_lite_native: null
  bao.desi_dr2: null
  sn.pantheonplus: null

theory:
  classy:
    path: ./class_public
    ignore_obsolete: false
    stop_at_error: false
    extra_args:
      gauge: synchronous
      ic: ad
      N_ur: 3.044
      N_ncdm: 0
      YHe: BBN
      scf_parameters: "5., 0., 0., 0., 4.44, 0."
      attractor_ic_scf: "no"
      scf_tuning_index: 0
      recombination: HYREC
      reio_parametrization: reio_camb
      k_pivot: 0.05
      non_linear: none

# Fresh c8 production-candidate parameterization.
# q_H is a periodic sampler coordinate only. H0 is reconstructed with an
# exact measure-preserving shear, so the original H0 ~ Uniform[55,82]
# target is unchanged. The predictor coefficients were frozen from c6 only.
params:
  q_H:
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.48148148148148, scale: 0.040}
    proposal: 0.020
    periodic: true
    drop: true
    latex: q_H
  H0:
    value: "lambda q_H, Omega_scf: 55.0 + 27.0*np.mod(q_H + ((68.00781035064747 - 0.48114439376854024*((Omega_scf-0.06988961182249204)/0.030640502057554492) - 0.11363064315320584*((Omega_scf-0.06988961182249204)/0.030640502057554492)**2) - 68.0)/27.0, 1.0)"
    min: 55.0
    max: 82.0
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.026}
    ref: {dist: norm, loc: 0.0224829626, scale: 0.00026}
    proposal: 0.00012
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.090, max: 0.155}
    ref: {dist: norm, loc: 0.118004955, scale: 0.0016}
    proposal: 0.0012
    latex: \omega_c
  logA:
    prior: {min: 2.75, max: 3.35}
    ref: {dist: norm, loc: 3.04497301, scale: 0.030}
    proposal: 0.008
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.90, max: 1.05}
    ref: {dist: norm, loc: 0.969337703, scale: 0.0070}
    proposal: 0.003
    latex: n_s
  tau_reio:
    prior: {min: 0.020, max: 0.120}
    ref: {dist: norm, loc: 0.056845975, scale: 0.014}
    proposal: 0.005
    latex: \tau
  Omega_scf:
    prior: {min: 0.001, max: 0.180}
    ref: {dist: norm, loc: 0.069889612, scale: 0.050}
    proposal: 0.008
    latex: \Omega_{\phi,0}
  Omega_m:
    derived: true
    latex: \Omega_m
  sigma8:
    derived: true
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5"
    latex: S_8

sampler:
  mcmc:
    max_samples: 50000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.15
    Rminus1_cl_level: 0.95
    learn_proposal: true
    learn_every: 40d
    proposal_scale: 2.4
    oversample_power: 0.4
    oversample_thin: true
    measure_speeds: true
    output_every: 60s
    max_tries: 1000d

debug: false
